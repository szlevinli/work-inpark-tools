[project]
name = "work-inpark-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "levin", email = "3259963@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "ipython>=9.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.0",
    "typer>=0.15.3",
]

[project.scripts]
inpark-tools = "work_inpark_tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nbstripout>=0.8.1",
]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
]
